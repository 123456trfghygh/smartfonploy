<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#121212">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Phone Collector</title>
<script src="/sdk.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
:root{--bg:#121212;--bg2:#1a1a1a;--bg3:#1e1e1e;--bg4:#2a2a2a;--bd:#333;--tx:#fff;--tx2:#ccc;--tx3:#888;--ac:#4caf50;--ac2:#64b5f6;--dg:#e53935;--gd:#ff9800}
body[data-theme="light"]{--bg:#f0f0f0;--bg2:#fff;--bg3:#fff;--bg4:#e8e8e8;--bd:#ddd;--tx:#222;--tx2:#444;--tx3:#888}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden;transition:background .3s}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--bd);font-size:13px;font-weight:bold;flex-shrink:0;padding-top:calc(10px + env(safe-area-inset-top))}
#topbar .money{color:var(--ac)}#topbar .nick{color:var(--ac2)}
#app{flex:1;overflow-y:auto;padding:14px;padding-bottom:90px}
.screen{display:none}.screen.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes insertScrewAnim{0%{transform:rotate(-720deg) scale(0);opacity:0}100%{transform:rotate(0deg) scale(1);opacity:1}}
.screw-inserting{animation:insertScrewAnim 0.4s forwards}
h2{margin-bottom:14px;font-size:19px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
h3{font-size:15px;margin-bottom:10px;color:var(--tx2)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:9px}
.card{background:var(--bg3);border-radius:12px;padding:9px;text-align:center;border:2px solid var(--bd);position:relative;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .rar{position:absolute;top:5px;left:5px;font-size:8px;padding:2px 5px;border-radius:4px;color:#fff;font-weight:bold;letter-spacing:.3px}
.card svg{width:52px;height:82px;margin:14px 0 6px}
.card .nm{font-size:10px;color:var(--tx2);font-weight:bold;line-height:1.2;min-height:24px}
.card .tk{font-size:7px;color:var(--tx3);margin-top:3px;word-break:break-all}
.card.locked svg{opacity:.15}.card.locked .nm{color:var(--tx3)}
.card.broken{filter:grayscale(.6);border-color:var(--dg)!important}
.card.broken .nm{color:var(--dg)}
.list{display:flex;flex-direction:column;gap:9px}
.row-item{background:var(--bg3);border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--bd);gap:10px}
.row-item .info{flex:1;min-width:0}
.row-item .t1{font-weight:bold;font-size:14px}
.row-item .t2{font-size:11px;color:var(--tx3);margin-top:3px}
.row-item .right{text-align:right;display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex-shrink:0}
.price{color:var(--ac);font-weight:bold;font-size:14px}
button{background:var(--ac);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:13px;font-weight:bold;cursor:pointer;transition:opacity .15s}
button:active{opacity:.7}button:disabled{background:var(--tx3);cursor:not-allowed;opacity:.5}
button.sec{background:var(--bg4);color:var(--tx)}button.dg{background:var(--dg)}button.sm{padding:5px 10px;font-size:11px}
input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--bd);background:var(--bg4);color:var(--tx);font-size:14px;outline:none}
input:focus{border-color:var(--ac)}
.row{display:flex;gap:8px;margin-top:8px}.row input{flex:1}.row button{flex-shrink:0}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);display:flex;justify-content:space-around;padding:8px 0 calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--bd);z-index:10}
.nav-item{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--tx3);background:none;border:none;padding:0 3px;cursor:pointer;flex:1}
.nav-item.active{color:var(--ac)}.nav-item .ic{font-size:18px;margin-bottom:2px}
.notif{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--bg4);padding:11px 20px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:all .3s;pointer-events:none;max-width:90%;text-align:center;border:1px solid var(--bd)}
.notif.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:300;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.show{opacity:1;pointer-events:auto}
.modal-content{background:var(--bg2);border-radius:16px;padding:18px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto}
.modal-content h3{margin-bottom:12px}
.modal-content .actions{display:flex;gap:10px;margin-top:16px}.modal-content .actions button{flex:1}
.empty{color:var(--tx3);text-align:center;padding:40px 20px;grid-column:1/-1;font-size:13px}
.sec-block{background:var(--bg3);border-radius:12px;padding:14px;margin-bottom:12px;border:1px solid var(--bd)}
.sec-block label{display:block;font-size:12px;color:var(--tx3);margin-bottom:8px}
.token-big{font-family:monospace;font-size:15px;color:var(--ac);background:var(--bg);padding:14px;border-radius:8px;text-align:center;letter-spacing:1px;font-weight:bold;word-break:break-all}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tabs button{background:var(--bg3);color:var(--tx2);font-size:12px;padding:7px 14px;white-space:nowrap;border:1px solid var(--bd)}
.tabs button.active{background:var(--ac);color:#fff;border-color:var(--ac)}
.progress{height:5px;background:var(--bg4);border-radius:3px;overflow:hidden;margin-top:6px}
.progress>div{height:100%;background:var(--ac);transition:width .3s}
.roulette-wrap{position:relative;overflow:hidden;padding:20px 0;margin:10px 0}
.roulette{display:flex;gap:8px;transition:transform 4s cubic-bezier(.2,.9,.3,1)}
.roulette .rcard{flex-shrink:0;width:100px;background:var(--bg3);border-radius:10px;padding:8px;text-align:center;border:2px solid var(--bd)}
.roulette .rcard svg{width:48px;height:74px}
.roulette .rcard .nm{font-size:9px;color:var(--tx2);margin-top:4px;min-height:22px}
.roulette-wrap::before,.roulette-wrap::after{content:'';position:absolute;top:0;bottom:0;width:40px;z-index:2;pointer-events:none}
.roulette-wrap::before{left:0;background:linear-gradient(90deg,var(--bg2),transparent)}
.roulette-wrap::after{right:0;background:linear-gradient(-90deg,var(--bg2),transparent)}
.roulette-center{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:2px;background:var(--gd);z-index:3;pointer-events:none;box-shadow:0 0 8px var(--gd)}
.detail-grid{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:start}
.detail-grid svg{width:100%;height:auto}
.detail-info p{font-size:12px;margin-bottom:6px;color:var(--tx2)}.detail-info p b{color:var(--tx)}
.badge{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;color:#fff;font-weight:bold}
</style>
</head>
<body data-theme="dark">
<div id="topbar">
  <span class="money">💰 <span id="money-display">0</span> $</span>
  <span class="nick">👤 <span id="nick-display">Игрок</span></span>
</div>
<div id="app"></div>
<nav class="bottom-nav" id="nav"></nav>
<div class="notif" id="notif"></div>
<div class="modal" id="modal"><div class="modal-content" id="modal-body"></div></div>

<script>
'use strict';

// ═══ 0. ОПРЕДЕЛЕНИЕ ПЛАТФОРМЫ И SDK ═══
const PLATFORM = (typeof YaGames !== 'undefined') ? 'yandex' : (typeof window.RuStoreSDK !== 'undefined' ? 'rustore' : 'web');
let yandexPlayer = null;

// ═══ 1. МОДЕЛИ (100 шт) ═══
const BRANDS_DATA={
'Vivo':['Y27','Y36','V29','X90','X100 Pro'],'Samsung':['Galaxy A05','Galaxy A54','Galaxy S23','Galaxy Z Flip 5','Galaxy S24 Ultra'],
'Apple':['iPhone SE','iPhone 13','iPhone 14','iPhone 15','iPhone 15 Pro Max'],'Poco':['Poco C65','Poco M6 Pro','Poco X6 Pro','Poco F5','Poco F6 Pro'],
'Oppo':['Oppo A58','Oppo A78','Oppo Reno 11','Oppo Find X7','Oppo Find N3'],'OnePlus':['Nord CE 3 Lite','Nord 3','OnePlus 11','OnePlus 12','OnePlus Open'],
'Xiaomi':['Redmi 13C','Redmi Note 13 Pro','Xiaomi 13T Pro','Xiaomi 14','Xiaomi 14 Ultra'],'Realme':['Realme C67','Realme Narzo 60','Realme 11','Realme 12 Pro+','Realme GT 5 Pro'],
'Honor':['Honor X9b','Honor 70','Honor 90','Honor Magic 6 Pro','Honor Magic V2'],'Huawei':['Huawei Nova 11','Huawei P60','Huawei P60 Pro','Huawei Mate 60 Pro','Huawei Mate X3'],
'Google':['Pixel 6a','Pixel 7a','Pixel 8','Pixel 8 Pro','Pixel Fold'],'Nothing':['CMF Phone 1','Nothing Phone (1)','Nothing Phone (2a)','Phone (2a) Plus','Nothing Phone (2)'],
'Motorola':['Moto G54','Moto G84','Moto Edge 40','Moto Edge 40 Pro','Moto Razr 40 Ultra'],'Nokia':['Nokia C32','Nokia G22','Nokia G42','Nokia X30','Nokia XR21'],
'Sony':['Xperia 10 V','Xperia 10 IV','Xperia 5 V','Xperia 1 IV','Xperia 1 V'],'Asus':['Zenfone 9','Zenfone 10','ROG Phone 6','ROG Phone 7','ROG Phone 8'],
'ZTE':['Blade A73','Blade V50','Nubia Z50','Axon 40','Axon 50 Ultra'],'Infinix':['Infinix Smart 8','Infinix Hot 40','Infinix Note 30 Pro','Infinix GT 10 Pro','Infinix Zero 30'],
'Tecno':['Tecno Spark 10','Tecno Pova 5','Tecno Camon 20','Tecno Camon 20 Pro','Tecno Phantom X2'],'Meizu':['Meizu 18 Pro','Meizu 20','Meizu 20 Infinity','Meizu 21','Meizu 21 Pro']
};
const RARITIES=['common','uncommon','rare','epic','legendary'];
const RINFO={common:{label:'Обычный',color:'#888',minVal:100,maxVal:300},uncommon:{label:'Необычный',color:'#4caf50',minVal:300,maxVal:600},rare:{label:'Редкий',color:'#2196f3',minVal:600,maxVal:1200},epic:{label:'Эпический',color:'#9c27b0',minVal:1200,maxVal:2500},legendary:{label:'Легендарный',color:'#ff9800',minVal:2500,maxVal:5000}};

// ═══ 2. ГЕНЕРАЦИЯ ═══
let ALL_PHONES=[];
function rnd(len){return Math.random().toString(36).substring(2,2+len).toUpperCase().padEnd(len,'0')}
function genPhoneToken(brand){return brand.substring(0,3).toUpperCase()+'-'+rnd(4)+'-'+rnd(4)+'-'+rnd(4)}
function genPlayerToken(){return 'USR-'+rnd(4)+'-'+rnd(4)+'-'+rnd(4)}
function generateAllPhones(){ALL_PHONES=[];let id=1;Object.keys(BRANDS_DATA).forEach(brand=>{BRANDS_DATA[brand].forEach((model,idx)=>{const rarity=RARITIES[idx],info=RINFO[rarity];ALL_PHONES.push({id:id++,brand,model,name:model.startsWith(brand)||model.includes(brand)?model:brand+' '+model,rarity,value:Math.floor(info.minVal+Math.random()*(info.maxVal-info.minVal)),color:['#2a2a2a','#333','#4a4a4a','#555','#6a6a6a','#888','#1a1a1a'][Math.floor(Math.random()*7)]})})}
function phoneSVG(p){const c=RINFO[p.rarity].color;return `<svg viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="8" width="84" height="144" rx="14" fill="${p.color}" stroke="${c}" stroke-width="2.5"/><rect x="16" y="24" width="68" height="112" rx="5" fill="#0a0a0a"/><circle cx="50" cy="146" r="4" fill="#222"/><rect x="58" y="14" width="18" height="22" rx="4" fill="#1a1a1a" stroke="#333"/><circle cx="64" cy="21" r="3" fill="#444"/><circle cx="70" cy="21" r="3" fill="#444"/><circle cx="67" cy="29" r="3" fill="#444"/></svg>`}

// ═══ 3. ЗВУКИ ═══
let audioCtx=null;
function beep(freq,dur,type){if(state.settings.muted)return;try{if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.frequency.value=freq;o.type=type||'sine';g.gain.setValueAtTime(.08,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);o.start();o.stop(audioCtx.currentTime+dur)}catch(e){}}
function soundClick(){beep(600,.06)}function soundWin(){beep(600,.1);setTimeout(()=>beep(800,.1),80);setTimeout(()=>beep(1000,.15),160)}function soundLegendary(){[600,800,1000,1200,1400].forEach((f,i)=>setTimeout(()=>beep(f,.12,'triangle'),i*70))}function soundError(){beep(200,.15,'sawtooth')}

// ═══ 4. СОСТОЯНИЕ ═══
const STORAGE_KEY='phoneCollector_v5';
const DEFAULT_STATE={money:3000,myPhones:[],myToken:null,nickname:'Игрок',shopItems:[],shopExpiresAt:0,lastDailyClaim:0,dailyStreak:0,achievements:{},stats:{casesOpened:0,phonesSold:0,phonesCrafted:0,exchanges:0,totalEarned:0,repairsDone:0},pity:{common:0,uncommon:0,rare:0,epic:0,legendary:0},history:[],settings:{muted:false,theme:'dark'},incomingRequests:[],sentRequests:[],onlinePlayers:[],dailyTasks:null,collectionSeen:{},shownAchievements:{},repairOrders:[],lastSaveTs:0};
let state;
try{state=Object.assign({},DEFAULT_STATE,JSON.parse(localStorage.getItem(STORAGE_KEY))||{})}catch(e){state=Object.assign({},DEFAULT_STATE)}
if(!state.myToken)state.myToken=genPlayerToken();
['myPhones','shopItems','history','incomingRequests','sentRequests','onlinePlayers','repairOrders'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
if(!state.settings)state.settings={muted:false,theme:'dark'};
function save(){state.lastSaveTs=Date.now();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}render()}
function pushHistory(text){state.history.unshift({text,ts:Date.now()});if(state.history.length>50)state.history.length=50}

// ═══ 5. УТИЛИТЫ ═══
function fmt(n){return n.toLocaleString('ru-RU')}
function notify(msg,isErr){const el=document.getElementById('notif');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2500);isErr?soundError():soundClick()}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ═══ 6. БОТЫ ═══
const BOT_NAMES=['AlexPro','Max_Gaming','SergeyK','PhoneFan','Nikita','Egor','Lena','Oleg','Sasha','Vlad','Igor','Masha','Nastya','Kolya','Roma','Pasha','Tolya','Yura','Dima','Kate','Misha','Boris','Anya','Vera','Grisha'];
function genBot(){const name=BOT_NAMES[Math.floor(Math.random()*BOT_NAMES.length)]+Math.floor(Math.random()*100);const phones=[];const count=3+Math.floor(Math.random()*8);for(let i=0;i<count;i++){const base=ALL_PHONES[Math.floor(Math.random()*ALL_PHONES.length)];phones.push({...base,id:'bot_'+Date.now()+'_'+Math.random().toString(36).substring(2,8),token:genPhoneToken(base.brand)})}return{name,token:genPlayerToken(),phones,lastActive:Date.now()}}
function ensureOnlinePlayers(){while(state.onlinePlayers.length<6)state.onlinePlayers.push(genBot())}

// ═══ 7. КЕЙСЫ / МАГАЗИН ═══
const CASES=[{id:1,name:'Базовый кейс',price:50,rarity:'common',icon:'📦'},{id:2,name:'Средний кейс',price:300,rarity:'uncommon',icon:'🎁'},{id:3,name:'Продвинутый кейс',price:350,rarity:'rare',icon:'💎'},{id:4,name:'Премиум кейс',price:1000,rarity:'epic',icon:'👑'},{id:5,name:'Элитный кейс',price:2500,rarity:'legendary',icon:'🔥'}];
const PITY_LIMIT={common:0,uncommon:5,rare:10,epic:20,legendary:40};
const SHOP_SIZE=12,SHOP_DURATION=3600000;
function refreshShop(){state.shopItems=[];const used=new Set();while(state.shopItems.length<SHOP_SIZE){const p=ALL_PHONES[Math.floor(Math.random()*ALL_PHONES.length)];if(used.has(p.id))continue;used.add(p.id);state.shopItems.push({...p,id:'shop_'+Date.now()+'_'+p.id,token:genPhoneToken(p.brand),shopPrice:Math.floor(p.value*(1.1+Math.random()*0.6))})}state.shopExpiresAt=Date.now()+SHOP_DURATION}
function refreshShopIfNeeded(){if(state.shopItems.length!==SHOP_SIZE||Date.now()>=state.shopExpiresAt)refreshShop()}

// ═══ 8. ДОСТИЖЕНИЯ / ЗАДАНИЯ / ДЕЙЛИ ═══
const ACHIEVEMENTS=[
{id:'first_case',name:'Первый кейс',desc:'Открыть 1 кейс',check:s=>s.stats.casesOpened>=1,reward:100},
{id:'case_10',name:'Кейс-мастер',desc:'Открыть 10 кейсов',check:s=>s.stats.casesOpened>=10,reward:300},
{id:'case_50',name:'Кейс-маньяк',desc:'Открыть 50 кейсов',check:s=>s.stats.casesOpened>=50,reward:1000},
{id:'collector_10',name:'Коллекционер',desc:'Собрать 10 телефонов',check:s=>s.myPhones.length>=10,reward:500},
{id:'collector_50',name:'Гуру',desc:'Собрать 50 телефонов',check:s=>s.myPhones.length>=50,reward:2000},
{id:'rich_10k',name:'Богач',desc:'Заработать 10 000$',check:s=>s.stats.totalEarned>=10000,reward:500},
{id:'legendary',name:'Легенда',desc:'Получить легендарный',check:s=>s.myPhones.some(p=>p.rarity==='legendary'),reward:1000},
{id:'trader',name:'Трейдер',desc:'Совершить 5 обменов',check:s=>s.stats.exchanges>=5,reward:800},
{id:'crafter',name:'Мастер',desc:'Скрафтить 3 телефона',check:s=>s.stats.phonesCrafted>=3,reward:400},
{id:'daily_3',name:'Постоянный',desc:'Стрик 3 дня',check:s=>s.dailyStreak>=3,reward:300},
{id:'repairer_5',name:'Ремонтник',desc:'Починить 5 телефонов',check:s=>s.stats.repairsDone>=5,reward:300},
{id:'repairer_20',name:'Мастер-ремонтник',desc:'Починить 20 телефонов',check:s=>s.stats.repairsDone>=20,reward:1500}];
const TASK_POOL=[{id:'open_case',name:'Открой 1 кейс',reward:100,target:1,key:'casesOpened'},{id:'sell_1',name:'Продай 1 телефон',reward:80,target:1,key:'phonesSold'},{id:'open_3',name:'Открой 3 кейса',reward:250,target:3,key:'casesOpened'},{id:'collect_5',name:'Получи 5 телефонов',reward:200,target:5,key:'phonesCollected'},{id:'craft_1',name:'Скрафти 1 телефон',reward:150,target:1,key:'phonesCrafted'},{id:'exchange_1',name:'Соверши 1 обмен',reward:200,target:1,key:'exchanges'},{id:'repair_1',name:'Починить 1 телефон',reward:100,target:1,key:'repairsDone'}];
function ensureDailyTasks(){const today=new Date().toDateString();if(!state.dailyTasks||state.dailyTasks.date!==today){const shuffled=[...TASK_POOL].sort(()=>Math.random()-.5).slice(0,3);state.dailyTasks={date:today,tasks:shuffled.map(t=>({...t,claimed:false})),baseline:{casesOpened:state.stats.casesOpened,phonesSold:state.stats.phonesSold,phonesCrafted:state.stats.phonesCrafted,exchanges:state.stats.exchanges,phonesCollected:(state.stats.phonesCollected||0),repairsDone:state.stats.repairsDone}};save()}}
const DAILY_REWARDS=[100,200,300,500,700,1000,2000];
function canClaimDaily(){return Date.now()-state.lastDailyClaim>=24*3600*1000}

// ═══ 9. ОТРИСОВКА ═══
function phoneCard(p,locked){const info=RINFO[p.rarity];if(locked)return `<div class="card locked" style="border-color:#2a2a2a">${phoneSVG({...p,color:'#111'})}<div class="nm">???</div></div>`;const brokenClass=p.broken?' broken':'';const brokenBadge=p.broken?'<div style="position:absolute;bottom:5px;right:5px;font-size:9px;background:var(--dg);color:#fff;padding:2px 5px;border-radius:4px">🔧 Сломан</div>':'';return `<div class="card${brokenClass}" style="border-color:${info.color}" onclick="showPhoneDetail('${p.id}')"><div class="rar" style="background:${info.color}">${info.label}</div>${phoneSVG(p)}<div class="nm">${escapeHtml(p.name)}</div><div class="tk">${p.token}</div>${brokenBadge}</div>`}

// ═══ 10. ЭКРАНЫ ═══
function screenPhones(){let html=`<h2>📱 Мои смартфоны <span style="font-size:13px;color:var(--tx3);font-weight:normal">(${state.myPhones.length})</span></h2>`;if(state.myPhones.length===0){html+='<p class="empty">Пусто. Открой кейс или купи в магазине!</p>'}else{html+='<div class="grid">'+state.myPhones.map(p=>phoneCard(p,false)).join('')+'</div>'}return html}
function screenCases(){let html='<h2>📦 Кейсы</h2><div class="list">';CASES.forEach(c=>{const info=RINFO[c.rarity];const pool=ALL_PHONES.filter(p=>p.rarity===c.rarity);const prices=pool.map(p=>p.value);const range=prices.length?`${Math.min(...prices)}–${Math.max(...prices)}$`:'—';const pityCnt=state.pity[c.rarity]||0;const pityMax=PITY_LIMIT[c.rarity];const pityText=pityMax?`Гарантия: ${pityMax-pityCnt} кейсов до ${info.label.toLowerCase()}`:'';html+=`<div class="row-item" style="border-color:${info.color}"><div class="info"><div class="t1">${c.icon} ${c.name}</div><div class="t2">${info.label} · ${range}</div>${pityText?`<div class="t2" style="color:var(--gd)">${pityText}</div>`:''}</div><div class="right"><div class="price">${c.price} $</div><button onclick="requestOpenCase(${c.id})">Открыть</button></div></div>`});html+='</div>';return html}
function screenShop(){let timeLeft=Math.max(0,state.shopExpiresAt-Date.now());const h=Math.floor(timeLeft/3600000),m=Math.floor((timeLeft%3600000)/60000),s=Math.floor((timeLeft%60000)/1000);let html=`<h2>🛒 Магазин <span style="font-size:12px;color:var(--gd);font-weight:normal">⏱ ${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}</span></h2><div class="list">`;if(state.shopItems.length===0)html+='<p class="empty">Магазин обновляется...</p>';else state.shopItems.forEach((item,idx)=>{const info=RINFO[item.rarity];html+=`<div class="row-item"><div class="info"><div class="t1" style="color:${info.color}">${escapeHtml(item.name)}</div><div class="t2">${info.label} · токен ${item.token}</div></div><div class="right"><div class="price">${fmt(item.shopPrice)} $</div><button onclick="requestBuy(${idx})">Купить</button></div></div>`});html+='</div>';return html}
function screenExchange(){let html='<h2>🔄 Обмен</h2>';html+='<div class="tabs"><button class="active" onclick="switchExchangeTab(\'online\',this)">🌐 Онлайн</button><button onclick="switchExchangeTab(\'incoming\',this)">📥 Входящие ('+state.incomingRequests.length+')</button><button onclick="switchExchangeTab(\'sent\',this)">📤 Отправленные ('+state.sentRequests.length+')</button></div><div id="exchange-content">'+renderExchangeContent('online')+'</div>';return html}
function renderExchangeContent(tab){if(tab==='online'){ensureOnlinePlayers();let h='<div class="list">';state.onlinePlayers.forEach((bot,idx)=>{h+=`<div class="row-item"><div class="info"><div class="t1">👤 ${escapeHtml(bot.name)}</div><div class="t2">${bot.phones.length} телефонов · токен ${bot.token}</div></div><div class="right"><button onclick="viewBotPhones(${idx})">Посмотреть</button></div></div>`});return h+'</div>'}if(tab==='incoming'){if(state.incomingRequests.length===0)return '<p class="empty">Нет входящих запросов.</p>';let h='<div class="list">';state.incomingRequests.forEach((req,idx)=>{h+=`<div class="row-item"><div class="info"><div class="t1">👤 ${escapeHtml(req.fromName)}</div><div class="t2">Хочет: <b>${escapeHtml(req.wantsName)}</b></div><div class="t2">Предлагает: <b>${escapeHtml(req.offersName)}</b></div></div><div class="right"><button class="sm" onclick="acceptIncoming(${idx})">Принять</button><button class="sm sec" onclick="declineIncoming(${idx})">Отклонить</button></div></div>`});return h+'</div>'}if(tab==='sent'){if(state.sentRequests.length===0)return '<p class="empty">Нет отправленных запросов.</p>';let h='<div class="list">';state.sentRequests.forEach(req=>{h+=`<div class="row-item"><div class="info"><div class="t1">Кому: ${escapeHtml(req.toName)}</div><div class="t2">Хочешь: ${escapeHtml(req.wantsName)}</div><div class="t2">Отдаёшь: ${escapeHtml(req.offersName)}</div></div><div class="right"><div class="t2" style="color:var(--gd)">⏳ Ожидание</div></div></div>`});return h+'</div>'}return ''}
function switchExchangeTab(tab,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('exchange-content').innerHTML=renderExchangeContent(tab)}
function screenRepair(){let html='<h2>🔧 Починка</h2>';html+='<div class="tabs"><button class="active" onclick="switchRepairTab(\'orders\',this)">📋 Заказы</button><button onclick="switchRepairTab(\'mine\',this)">📱 Мои смартфоны</button></div><div id="repair-content">'+renderRepairContent('orders')+'</div>';return html}
function renderRepairContent(tab){if(tab==='orders'){if(state.repairOrders.length===0){generateRepairOrders()}let h='<div class="list">';state.repairOrders.forEach((order,idx)=>{const info=RINFO[order.phone.rarity];h+=`<div class="row-item"><div class="info"><div class="t1" style="color:${info.color}">${escapeHtml(order.phone.name)}</div><div class="t2">Заказчик: ${escapeHtml(order.clientName)}</div><div class="t2">Награда: <b style="color:var(--ac)">+${order.reward} $</b></div></div><div class="right"><button onclick="startRepair(${idx},'order')">Починить</button></div></div>`});return h+'</div>'}if(tab==='mine'){const broken=state.myPhones.filter(p=>p.broken);if(broken.length===0)return '<p class="empty">У вас нет сломанных смартфонов.</p>';let h='<div class="grid">';broken.forEach(p=>{h+=phoneCard(p,false)});return h+'</div>'}return ''}
function switchRepairTab(tab,btn){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');document.getElementById('repair-content').innerHTML=renderRepairContent(tab)}
function generateRepairOrders(){state.repairOrders=[];for(let i=0;i<3;i++){const base=ALL_PHONES[Math.floor(Math.random()*ALL_PHONES.length)];state.repairOrders.push({id:'order_'+Date.now()+'_'+i,phone:{...base,token:genPhoneToken(base.brand)},clientName:BOT_NAMES[Math.floor(Math.random()*BOT_NAMES.length)]+Math.floor(Math.random()*100),reward:10})}try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}
function screenCollection(){let html='<h2>🗂️ Коллекция</h2>';let total=ALL_PHONES.length,seen=Object.keys(state.collectionSeen).length;html+=`<div class="sec-block"><div style="font-size:13px;margin-bottom:6px">Открыто: <b>${seen} / ${total}</b></div><div class="progress"><div style="width:${(seen/total*100).toFixed(1)}%"></div></div></div>`;const byBrand={};ALL_PHONES.forEach(p=>{if(!byBrand[p.brand])byBrand[p.brand]=[];byBrand[p.brand].push(p)});Object.keys(byBrand).forEach(brand=>{const phones=byBrand[brand];const found=phones.filter(p=>state.collectionSeen[p.id]).length;const complete=found===phones.length;html+=`<div class="sec-block"><div style="display:flex;justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${brand} ${complete?'🏆':''}</h3><span style="font-size:12px;color:var(--tx3)">${found}/${phones.length}</span></div><div class="grid">${phones.map(p=>state.collectionSeen[p.id]?phoneCard(p,false):phoneCard(p,true)).join('')}</div></div>`});return html}
function screenProfile(){ensureDailyTasks();const canClaim=canClaimDaily();const dailyIdx=state.dailyStreak%7;const nextReward=DAILY_REWARDS[dailyIdx];let html='<h2>👤 Профиль</h2>';html+=`<div class="sec-block"><label>🔑 Мой уникальный токен</label><div class="token-big">${state.myToken}</div><button onclick="copyToken()" style="margin-top:10px;width:100%">📋 Копировать</button></div>`;html+=`<div class="sec-block"><label>✏️ Никнейм</label><div class="row"><input id="nick-input" value="${escapeHtml(state.nickname)}"><button onclick="saveNickname()">OK</button></div></div>`;html+=`<div class="sec-block"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><b>🎁 Ежедневный бонус</b><span style="font-size:12px;color:var(--tx3)">Стрик: ${state.dailyStreak} 🔥</span></div><div style="font-size:12px;color:var(--tx3);margin-bottom:8px">Следующая награда: <b style="color:var(--ac)">${nextReward} $</b></div>`+(canClaim?`<button onclick="claimDaily()" style="width:100%">Забрать ${nextReward} $</button>`:`<button disabled style="width:100%">Уже получено сегодня</button>`)+'</div>';if(state.dailyTasks){html+='<div class="sec-block"><b style="display:block;margin-bottom:10px">📋 Задания дня</b>';state.dailyTasks.tasks.forEach((t,i)=>{const base=state.dailyTasks.baseline[t.key]||0;const cur=(state.stats[t.key]||0)-base;const done=cur>=t.target;html+=`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>${t.name}</span><span style="color:var(--ac)">${t.reward} $</span></div><div class="progress"><div style="width:${Math.min(100,cur/t.target*100)}%"></div></div>`;if(t.claimed)html+=`<div style="font-size:11px;color:var(--ac);margin-top:4px">✅ Получено</div>`;else if(done)html+=`<button class="sm" onclick="claimTask(${i})" style="margin-top:6px;width:100%">Забрать</button>`;html+='</div>'});html+='</div>'}html+='<div class="sec-block"><b style="display:block;margin-bottom:10px">🏆 Достижения</b>';ACHIEVEMENTS.forEach(a=>{const done=!!state.achievements[a.id];html+=`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:12px"><div><div style="font-weight:bold">${done?'✅ ':'○ '}${a.name}</div><div style="color:var(--tx3);font-size:11px">${a.desc}</div></div><span style="color:var(--ac);font-weight:bold">${a.reward} $</span></div>`});html+='</div>';html+=`<div class="sec-block"><b style="display:block;margin-bottom:10px">⚒️ Крафт (3 одинаковых редкости → 1 выше)</b><div style="display:flex;gap:8px;flex-wrap:wrap">`;['common','uncommon','rare','epic'].forEach(r=>{const count=state.myPhones.filter(p=>p.rarity===r).length;const info=RINFO[r];html+=`<button class="sec sm" onclick="requestCraft('${r}')" ${count<3?'disabled':''} style="flex:1">${info.label} (${count})</button>`});html+='</div></div>';html+='<div class="sec-block"><b style="display:block;margin-bottom:10px">📜 История</b>';if(state.history.length===0)html+='<div style="font-size:12px;color:var(--tx3)">Пока пусто</div>';else html+=state.history.slice(0,20).map(h=>`<div style="font-size:11px;color:var(--tx2);padding:4px 0;border-bottom:1px solid var(--bd)">${new Date(h.ts).toLocaleString('ru-RU',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})} — ${escapeHtml(h.text)}</div>`).join('');html+='</div>';html+='<div class="sec-block"><b style="display:block;margin-bottom:10px">🥇 Топ коллекционеров</b>';const myValue=state.myPhones.reduce((s,p)=>s+p.value,0);const leaderboard=[{n:'PhoneKing',v:28500},{n:'Collector_X',v:24300},{n:'SergeyK',v:19800},{n:'Max_Gaming',v:16400},{n:'Lena',v:12900},{n:'Vlad',v:9800},{n:'AlexPro',v:7200},{n:'★ Вы',v:myValue,me:true}].sort((a,b)=>b.v-a.v);leaderboard.forEach((p,i)=>{html+=`<div style="display:flex;justify-content:space-between;padding:6px 0;font-size:12px;${p.me?'color:var(--ac);font-weight:bold':''}"><span>${i+1}. ${p.n}</span><span>${fmt(p.v)} $</span></div>`});html+='</div>';html+='<div class="sec-block"><b style="display:block;margin-bottom:10px">⚙️ Настройки</b>';html+=`<div style="display:flex;gap:8px;margin-bottom:8px"><button class="sec sm" onclick="toggleTheme()" style="flex:1">${state.settings.theme==='dark'?'☀️ Светлая тема':'🌙 Тёмная тема'}</button><button class="sec sm" onclick="toggleMute()" style="flex:1">${state.settings.muted?'🔊 Вкл. звук':'🔇 Выкл. звук'}</button></div>`;if(PLATFORM==='yandex')html+=`<div style="font-size:11px;color:var(--ac);text-align:center;margin-bottom:8px">☁️ Облачное сохранение включено</div>`;else html+=`<div style="font-size:11px;color:var(--tx3);text-align:center;margin-bottom:8px">Платформа: ${PLATFORM==='rustore'?'RuStore':'Web'}</div>`;html+=`<button class="dg sm" onclick="requestReset()" style="width:100%">🗑 Сбросить прогресс</button></div>`;return html}

// ═══ 11. НАВИГАЦИЯ ═══
const SCREENS={phones:{icon:'📱',name:'Смартфоны',fn:screenPhones},cases:{icon:'📦',name:'Кейсы',fn:screenCases},shop:{icon:'🛒',name:'Магазин',fn:screenShop},repair:{icon:'🔧',name:'Починка',fn:screenRepair},exchange:{icon:'🔄',name:'Обмен',fn:screenExchange},collection:{icon:'🗂️',name:'Коллекция',fn:screenCollection},profile:{icon:'👤',name:'Профиль',fn:screenProfile}};
let currentScreen='phones';
function switchScreen(id){if(currentScreen===id)return;currentScreen=id;soundClick();render()}
function render(){document.body.setAttribute('data-theme',state.settings.theme);document.getElementById('money-display').textContent=fmt(state.money);document.getElementById('nick-display').textContent=state.nickname;document.getElementById('app').innerHTML=SCREENS[currentScreen].fn();document.getElementById('nav').innerHTML=Object.keys(SCREENS).map(k=>`<button class="nav-item ${k===currentScreen?'active':''}" onclick="switchScreen('${k}')"><span class="ic">${SCREENS[k].icon}</span>${SCREENS[k].name}</button>`).join('');let changed=false;state.myPhones.forEach(p=>{const baseId=ALL_PHONES.find(x=>x.brand===p.brand&&x.model===p.model)?.id;if(baseId&&!state.collectionSeen[baseId]){state.collectionSeen[baseId]=true;changed=true}});if(changed)try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}checkAchievements()}
function checkAchievements(){let n=false;ACHIEVEMENTS.forEach(a=>{if(!state.achievements[a.id]&&a.check(state)){state.achievements[a.id]=true;state.money+=a.reward;state.stats.totalEarned+=a.reward;if(!state.shownAchievements[a.id]){state.shownAchievements[a.id]=true;setTimeout(()=>notify(`🏆 Достижение: ${a.name} (+${a.reward}$)`),100);n=true}}});if(n)try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}catch(e){}}

// ═══ 12. МОДАЛКИ ═══
function showModal(html,opts){const m=document.getElementById('modal');document.getElementById('modal-body').innerHTML=html;m.classList.add('show');if(opts&&opts.dismissible)m.onclick=e=>{if(e.target===m)closeModal()};else m.onclick=null}
function closeModal(){document.getElementById('modal').classList.remove('show')}

// ═══ 13. КЕЙСЫ / МАГАЗИН / ПРОДАЖА ═══
function requestOpenCase(caseId){const c=CASES.find(x=>x.id===caseId);if(!c)return;if(state.money<c.price)return notify('❌ Недостаточно денег!',true);showModal(`<h3>${c.icon} ${c.name}</h3><p style="font-size:13px;color:var(--tx3);margin-bottom:10px">Цена: <b style="color:var(--ac)">${c.price} $</b></p><p style="font-size:13px;color:var(--tx3)">Открыть? Внутри — случайный телефон редкости «${RINFO[c.rarity].label}».</p><div class="actions"><button class="sec" onclick="closeModal()">Отмена</button><button onclick="openCase(${caseId})">Открыть за ${c.price}$</button></div>`)}
function openCase(caseId){closeModal();const c=CASES.find(x=>x.id===caseId);if(!c||state.money<c.price)return notify('❌ Недостаточно денег!',true);state.pity[c.rarity]=(state.pity[c.rarity]||0)+1;const pool=ALL_PHONES.filter(p=>p.rarity===c.rarity);const winner=pool[Math.floor(Math.random()*pool.length)];const broken=c.rarity==='common'&&Math.random()<0.30;const newPhone={...winner,id:'own_'+Date.now()+'_'+Math.random().toString(36).substring(2,8),token:genPhoneToken(winner.brand),broken};state.money-=c.price;state.stats.casesOpened++;const WINNER_POS=30;const rollItems=[];for(let i=0;i<40;i++){if(i===WINNER_POS)rollItems.push({...winner,isWinner:true});else rollItems.push(pool[Math.floor(Math.random()*pool.length)])}const info=RINFO[c.rarity];let rollHtml='<div class="roulette-wrap"><div class="roulette-center"></div><div class="roulette" id="roulette">';rollItems.forEach((item,i)=>{rollHtml+=`<div class="rcard" style="${item.isWinner?`border-color:${info.color};box-shadow:0 0 12px ${info.color}`:`border-color:var(--bd)`}">${phoneSVG(item)}<div class="nm">${escapeHtml(item.name)}</div></div>`});rollHtml+='</div></div>';showModal(`<h3 style="text-align:center;margin-bottom:6px">${c.icon} ${c.name}</h3>${rollHtml}<div id="roll-result" style="text-align:center;min-height:60px"></div>`,{dismissible:false});setTimeout(()=>{const rollEl=document.getElementById('roulette');if(!rollEl)return;const cardW=108;const targetX=-(WINNER_POS*cardW)+(document.querySelector('.roulette-wrap').offsetWidth/2-cardW/2);rollEl.style.transform=`translateX(${targetX}px)`;beep(400,.05,'square');let t=0;const ti=setInterval(()=>{beep(600,.03,'square');t++;if(t>15)clearInterval(ti)},200)},100);setTimeout(()=>{state.myPhones.push(newPhone);if(c.rarity==='legendary')soundLegendary();else soundWin();pushHistory(`Открыт ${c.name} → ${newPhone.name}${newPhone.broken?' (сломан)':''}`);const resEl=document.getElementById('roll-result');if(resEl){const i2=RINFO[newPhone.rarity];resEl.innerHTML=`<div style="font-size:16px;font-weight:bold;color:${i2.color};margin-bottom:4px">${escapeHtml(newPhone.name)}</div><div style="font-size:12px;color:var(--tx3);margin-bottom:4px">${i2.label} · ${newPhone.value} $ · ${newPhone.token}</div>${newPhone.broken?'<div style="font-size:12px;color:var(--dg);margin-bottom:12px">⚠️ Телефон сломан! Почините в разделе «🔧 Починка».</div>':'<div style="margin-bottom:12px"></div>'}<button onclick="closeModal();save();" style="width:100%">Забрать</button>`}save()},4300)}
function requestBuy(idx){const item=state.shopItems[idx];if(!item)return;if(state.money<item.shopPrice)return notify('❌ Недостаточно денег!',true);showModal(`<h3>🛒 Подтверждение покупки</h3><p style="font-size:14px;margin-bottom:6px"><b>${escapeHtml(item.name)}</b></p><p style="font-size:12px;color:var(--tx3);margin-bottom:12px">${RINFO[item.rarity].label} · токен ${item.token}</p><p style="font-size:13px">Цена: <b style="color:var(--ac)">${fmt(item.shopPrice)} $</b></p><div class="actions"><button class="sec" onclick="closeModal()">Отмена</button><button onclick="buyPhone(${idx})">Купить</button></div>`)}
function buyPhone(idx){const item=state.shopItems[idx];if(!item||state.money<item.shopPrice){closeModal();return notify('❌ Ошибка',true)}const broken=Math.random()<0.25;state.money-=item.shopPrice;state.myPhones.push({...item,id:'own_'+Date.now()+'_'+Math.random().toString(36).substring(2,8),broken});state.shopItems.splice(idx,1);pushHistory(`Куплен ${item.name} за ${item.shopPrice} ${broken?'(сломан)':''}`);closeModal();save();notify(`✅ Куплено: ${item.name}${broken?' (⚠️ сломан!)':''}`)}
function showPhoneDetail(id){const p=state.myPhones.find(x=>x.id===id);if(!p)return;const info=RINFO[p.rarity];const brokenBlock=p.broken?`<p style="color:var(--dg);font-weight:bold">⚠️ Телефон сломан</p>`:'';const actionButtons=p.broken?`<button onclick="closeModal();startRepair('${p.id}','mine')" style="width:100%">🔧 Починить</button>`:`<button class="dg" onclick="requestSell('${p.id}')" style="width:100%">💰 Продать за ${fmt(Math.floor(p.value*.8))} $</button><button onclick="closeModal();showPhoneInterface('${escapeHtml(p.name)}')" style="width:100%">📱 Зайти в телефон</button>`;showModal(`<div class="detail-grid">${phoneSVG(p)}<div class="detail-info"><p><b>${escapeHtml(p.name)}</b></p><p>Бренд: <b>${p.brand}</b></p><p>Редкость: <span class="badge" style="background:${info.color}">${info.label}</span></p><p>Стоимость: <b style="color:var(--ac)">${fmt(p.value)} $</b></p><p style="font-family:monospace;font-size:10px;word-break:break-all;color:var(--tx3)">Токен: ${p.token}</p>${brokenBlock}</div></div><div class="actions" style="flex-direction:column">${actionButtons}<button class="sec" onclick="closeModal()">Закрыть</button></div>`)}
function requestSell(id){const p=state.myPhones.find(x=>x.id===id);if(!p)return;if(p.broken)return notify('Сначала почините телефон',true);showModal(`<h3>💰 Продажа</h3><p style="font-size:13px;margin-bottom:10px">Продать <b>${escapeHtml(p.name)}</b> за <b style="color:var(--ac)">${fmt(Math.floor(p.value*.8))} $</b>?</p><div class="actions"><button class="sec" onclick="closeModal()">Отмена</button><button class="dg" onclick="sellPhone('${id}')">Продать</button></div>`)}
function sellPhone(id){const idx=state.myPhones.findIndex(p=>p.id===id);if(idx===-1){closeModal();return}const p=state.myPhones[idx];if(p.broken){closeModal();return notify('Сначала почините телефон',true)}const earn=Math.floor(p.value*.8);state.money+=earn;state.stats.phonesSold++;state.stats.totalEarned+=earn;state.myPhones.splice(idx,1);pushHistory(`Продан ${p.name} за ${earn} $`);closeModal();save();notify(`💰 +${earn}$`)}

// ═══ 14. РЕМОНТ ═══
function startRepair(id,context){let phone,orderIdx=null,myPhoneId=null;if(context==='order'){const order=state.repairOrders[id];if(!order)return;phone=order.phone;orderIdx=id}else{phone=state.myPhones.find(p=>p.id===id&&p.broken);if(!phone)return notify('Телефон не найден',true);myPhoneId=id}showRepairMinigame(phone,orderIdx,myPhoneId)}
function showRepairMinigame(phone,orderIdx,myPhoneId){
const rs={phase:1,screwsOut:[false,false,false,false],coverLifted:false,brokenRemoved:false,newInstalled:false,screenOn:false,animatingScrew:null,reassembling:false};
const screwPos=[{x:72,y:72},{x:228,y:72},{x:72,y:428},{x:228,y:428}];
function buildSVG(){let svg=`<svg id="repair-svg" viewBox="0 0 300 500" style="width:100%;max-width:260px;display:block;margin:0 auto">`;svg+=`<g style="opacity:${rs.coverLifted?1:0};transition:opacity 0.5s"><rect x="50" y="50" width="200" height="400" rx="25" fill="#2a2a2a"/><rect x="70" y="80" width="160" height="240" rx="8" fill="#141414" stroke="#333"/><rect x="80" y="90" width="70" height="70" rx="6" fill="#0a0a0a"/><circle cx="100" cy="110" r="8" fill="#222"/><circle cx="130" cy="110" r="8" fill="#222"/><circle cx="100" cy="140" r="8" fill="#222"/>`;const batVisible=!(rs.brokenRemoved&&!rs.newInstalled);const batGlow=(!rs.newInstalled&&!rs.brokenRemoved)?'filter:drop-shadow(0 0 8px #f44336);':'';svg+=`<g id="battery-g" style="opacity:${batVisible?1:0};transition:opacity 0.3s"><rect x="80" y="200" width="140" height="100" rx="8" fill="#1e3a1e" stroke="#4caf50" stroke-width="1.5" style="${batGlow}"/><text x="150" y="255" text-anchor="middle" fill="#4caf50" font-size="11" font-weight="bold">BATTERY</text></g><rect x="80" y="315" width="60" height="20" rx="3" fill="#0a0a0a"/><rect x="120" y="440" width="60" height="6" rx="3" fill="#0a0a0a"/></g>`;svg+=`<g id="cover-g" style="transform:translateY(${rs.coverLifted?-520:0}px)"><rect x="50" y="50" width="200" height="400" rx="25" fill="${phone.color||'#444'}"/><rect x="80" y="80" width="70" height="70" rx="6" fill="#1a1a1a"/><circle cx="100" cy="110" r="8" fill="#2a2a2a"/><circle cx="130" cy="110" r="8" fill="#2a2a2a"/>`;screwPos.forEach((p,i)=>{if(!rs.screwsOut[i]){const ac=(rs.animatingScrew===i)?'screw-inserting':'';svg+=`<g transform="translate(${p.x},${p.y})"><g class="screw ${ac}" id="screw-${i}" onclick="window.__unscrew(${i})" style="cursor:pointer"><circle r="9" fill="#555" stroke="#333" stroke-width="1.5"/><circle r="5" fill="#666"/><line x1="-5" y1="0" x2="5" y2="0" stroke="#222" stroke-width="2.5"/><line x1="0" y1="-5" x2="0" y2="5" stroke="#222" stroke-width="2.5"/></g></g>`}});svg+=`</g>`;if(rs.screenOn){svg+=`<rect x="50" y="50" width="200" height="400" rx="25" fill="#000" style="opacity:0;animation:fadeIn 0.4s forwards"/><rect x="55" y="55" width="190" height="390" rx="21" fill="#0a2a0a" style="opacity:0;animation:fadeIn 0.4s 0.15s forwards"/><text x="150" y="245" text-anchor="middle" fill="#4caf50" font-size="32" font-weight="bold" style="opacity:0;animation:fadeIn 0.4s 0.3s forwards">✓</text>`}return svg+`</svg>`}
function buildInstruction(){const left=rs.screwsOut.filter(x=>!x).length;if(rs.reassembling)return 'Сборка...';switch(rs.phase){case 1:return `Открутите винты: ${4-left} / 4`;case 3:return 'Диагностика: сломана деталь';case 4:return 'Установите новую деталь';case 5:return 'Соберите телефон';case 6:return 'Включите телефон';default:return ''}}
function buildButton(){if(rs.reassembling)return '';switch(rs.phase){case 1:return rs.screwsOut.every(x=>x)?`<button onclick="window.__liftCover()" style="width:100%;padding:14px;font-size:14px">🪛 Снять крышку</button>`:'';case 3:return `<button onclick="window.__removeBroken()" style="width:100%;padding:14px;font-size:14px">🔍 Снять деталь</button>`;case 4:return `<button onclick="window.__installPart()" style="width:100%;padding:14px;font-size:14px">🔧 Установить</button>`;case 5:return `<button onclick="window.__reassemble()" style="width:100%;padding:14px;font-size:14px">🔩 Собрать</button>`;case 6:return `<button onclick="window.__powerOn()" style="width:100%;padding:14px;font-size:14px">🔌 Включить</button>`;default:return ''}}
function render(){showModal(`<h3 style="text-align:center;margin-bottom:8px">🔧 ${escapeHtml(phone.name)}</h3><div style="background:var(--bg);border-radius:12px;padding:14px;margin:10px 0;overflow:hidden">${buildSVG()}</div><div style="text-align:center;font-size:13px;color:var(--tx2);margin-bottom:12px" id="repair-instruction">${buildInstruction()}</div><div id="repair-action-area">${buildButton()}</div>`,{dismissible:false})}
window.__unscrew=(i)=>{if(rs.screwsOut[i])return;const screw=document.getElementById('screw-'+i);if(screw){screw.style.transition='transform 0.4s, opacity 0.4s';screw.style.transform='rotate(720deg) scale(0)';screw.style.opacity='0';screw.style.pointerEvents='none'}rs.screwsOut[i]=true;beep(700,0.08,'square');setTimeout(()=>{const inst=document.getElementById('repair-instruction');const btn=document.getElementById('repair-action-area');const left=rs.screwsOut.filter(x=>!x).length;if(inst)inst.textContent=left===0?'Все винты откручены!':`Открутите винты: ${4-left} / 4`;if(btn&&left===0)btn.innerHTML=`<button onclick="window.__liftCover()" style="width:100%;padding:14px;font-size:14px">🪛 Снять крышку</button>`},400)};
window.__liftCover=()=>{rs.phase=2;const cover=document.getElementById('cover-g');if(cover){cover.style.transition='transform 0.9s cubic-bezier(.6,0,.3,1)';cover.style.transform='translateY(-520px)'}const inside=document.querySelector('#repair-svg > g');if(inside)inside.style.opacity=1;setTimeout(()=>{rs.coverLifted=true;rs.phase=3;render();beep(400,0.1)},1000)};
window.__removeBroken=()=>{rs.brokenRemoved=true;const bat=document.getElementById('battery-g');if(bat)bat.style.opacity=0;beep(250,0.3,'sawtooth');setTimeout(()=>{rs.phase=4;render()},400)};
window.__installPart=()=>{rs.newInstalled=true;const bat=document.getElementById('battery-g');if(bat){bat.style.opacity=1;const rect=bat.querySelector('rect');if(rect)rect.style.filter='none'}beep(500,0.1);setTimeout(()=>beep(800,0.15),100);setTimeout(()=>{rs.phase=5;render()},400)};
window.__reassemble=()=>{rs.reassembling=true;const cover=document.getElementById('cover-g');if(cover){cover.style.transition='transform 0.9s cubic-bezier(.6,0,.3,1)';cover.style.transform='translateY(0)'}setTimeout(()=>{rs.coverLifted=false;let i=0;const insertNext=()=>{if(i>=4){rs.reassembling=false;rs.animatingScrew=null;rs.phase=6;render();return}rs.animatingScrew=i;rs.screwsOut[i]=false;render();beep(700,0.08,'square');setTimeout(()=>{rs.animatingScrew=null;i++;insertNext()},500)};insertNext()},1000)};
window.__powerOn=()=>{rs.screenOn=true;rs.phase=7;soundWin();render();setTimeout(()=>{if(orderIdx!==null&&orderIdx!==undefined){state.repairOrders.splice(orderIdx,1);state.money+=10;state.stats.totalEarned+=10;state.stats.repairsDone++;pushHistory(`Починен заказ: ${phone.name} (+10 $)`);if(state.repairOrders.length===0)generateRepairOrders()}else if(myPhoneId){const p=state.myPhones.find(x=>x.id===myPhoneId);if(p){p.broken=false;state.stats.repairsDone++;state.money+=10;state.stats.totalEarned+=10;pushHistory(`Починен ${phone.name} (+10 $)`)}}save();notify('✅ Починено! +10 $');setTimeout(()=>{showModal(`<h3 style="text-align:center">✅ Телефон починен!</h3><p style="text-align:center;font-size:14px;color:var(--tx2);margin:14px 0">Получено: <b style="color:var(--ac)">+10 $</b></p><p style="text-align:center;font-size:12px;color:var(--tx3);margin-bottom:14px">Хотите зайти внутрь телефона?</p><div class="actions"><button class="sec" onclick="closeModal()">Позже</button><button onclick="closeModal();showPhoneInterface('${escapeHtml(phone.name)}')">📱 Зайти</button></div>`)},800)},1500)};
render()}

// ═══ 15. ИНТЕРФЕЙС ТЕЛЕФОНА С РАБОТАЮЩИМИ ПРИЛОЖЕНИЯМИ ═══
let currentPhoneName='';

const PHONE_APPS=[
{id:'camera',icon:'📷',name:'Камера',render:renderCameraApp},
{id:'gallery',icon:'🖼️',name:'Галерея',render:renderGalleryApp},
{id:'settings',icon:'⚙️',name:'Настройки',render:renderSettingsApp},
{id:'music',icon:'🎵',name:'Музыка',render:renderMusicApp},
{id:'messages',icon:'💬',name:'Сообщения',render:renderMessagesApp},
{id:'phone',icon:'📞',name:'Телефон',render:renderPhoneApp},
{id:'browser',icon:'🌐',name:'Браузер',render:renderBrowserApp},
{id:'calendar',icon:'📅',name:'Календарь',render:renderCalendarApp}
];

function phoneBackButton(){return `<div style="margin-bottom:12px"><button onclick="showPhoneInterface('${escapeHtml(currentPhoneName)}')" style="background:rgba(255,255,255,.2);color:#fff;padding:6px 14px;font-size:12px;border-radius:12px">← Назад</button></div>`}

function showPhoneInterface(phoneName){
  currentPhoneName=phoneName;
  const time=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const appsGrid=PHONE_APPS.map(app=>`<div onclick="openPhoneApp('${app.id}')" style="background:rgba(255,255,255,.15);border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;transition:transform .1s" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'"><div style="font-size:24px">${app.icon}</div><div style="font-size:9px;margin-top:4px;opacity:.9">${app.name}</div></div>`).join('');
  showModal(`<div style="background:linear-gradient(135deg,#1a237e,#4a148c);border-radius:20px;padding:16px;min-height:460px;color:#fff"><div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:16px"><span>${time}</span><span>📶 🔋100%</span></div><div style="text-align:center;margin-bottom:16px;font-size:12px;opacity:.85">${escapeHtml(phoneName)}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">${appsGrid}</div><div style="text-align:center;margin-top:24px"><button onclick="closeModal()" style="background:rgba(255,255,255,.2);color:#fff;border-radius:20px;padding:8px 24px">🏠 Выход</button></div></div>`);
}

function openPhoneApp(appId){const app=PHONE_APPS.find(a=>a.id===appId);if(!app)return;soundClick();showModal(app.render())}

function renderCameraApp(){return `<div style="background:#000;border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<div style="background:linear-gradient(135deg,#333,#555);border-radius:12px;height:340px;display:flex;align-items:center;justify-content:center;position:relative"><div style="position:absolute;top:10px;left:10px;font-size:10px;color:#fff;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:8px">📷 Камера</div><div style="font-size:60px;opacity:.3">🏙️</div></div><div style="display:flex;justify-content:space-around;align-items:center;margin-top:20px"><div style="width:40px;height:40px;border-radius:8px;background:linear-gradient(135deg,#4a148c,#1a237e)"></div><div onclick="notify('📸 Снимок сделан!')" style="width:60px;height:60px;border-radius:50%;background:#fff;border:4px solid #888;cursor:pointer"></div><div onclick="notify('🔄 Камера переключена')" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer">🔄</div></div></div>`}
function renderGalleryApp(){const g=['#e91e63,#9c27b0','#2196f3,#00bcd4','#4caf50,#8bc34a','#ff9800,#ff5722','#9c27b0,#673ab7','#00bcd4,#009688','#ff5722,#e91e63','#3f51b5,#2196f3','#795548,#607d8b'];const photos=g.map((gr,i)=>`<div onclick="notify('Фото ${i+1} открыто')" style="background:linear-gradient(135deg,${gr});border-radius:8px;aspect-ratio:1;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px">📷</div>`).join('');return `<div style="background:#1a1a1a;border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<h3 style="margin-bottom:12px">🖼️ Галерея</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px">${photos}</div></div>`}
function renderSettingsApp(){const items=[{name:'Wi-Fi',desc:'Подключено: Home_5G',icon:'📶',toggle:true},{name:'Bluetooth',desc:'Выключено',icon:'🔵',toggle:false},{name:'Звук',desc:'Средний уровень',icon:'🔊',toggle:true},{name:'Уведомления',desc:'Включены',icon:'🔔',toggle:true},{name:'Батарея',desc:'100%',icon:'🔋',toggle:false},{name:'Экран',desc:'Авто-яркость',icon:'☀️',toggle:true},{name:'Местоположение',desc:'Включено',icon:'📍',toggle:true},{name:'О телефоне',desc:escapeHtml(currentPhoneName),icon:'ℹ️',toggle:false}];return `<div style="background:#1a1a1a;border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<h3 style="margin-bottom:12px">⚙️ Настройки</h3><div>${items.map(it=>`<div onclick="notify('${it.name} — ${it.desc}')" style="display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #333;cursor:pointer"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:20px">${it.icon}</span><div><div style="font-size:13px;font-weight:bold">${it.name}</div><div style="font-size:11px;color:#888">${it.desc}</div></div></div>${it.toggle?'<div style="width:36px;height:20px;background:#4caf50;border-radius:10px;position:relative"><div style="position:absolute;right:2px;top:2px;width:16px;height:16px;background:#fff;border-radius:50%"></div></div>':'<div style="color:#666">›</div>'}</div>`).join('')}</div></div>`}
function renderMusicApp(){return `<div style="background:linear-gradient(135deg,#1a237e,#4a148c);border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<div style="text-align:center;margin:20px 0"><div style="width:180px;height:180px;background:linear-gradient(135deg,#e91e63,#9c27b0);border-radius:16px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:60px">🎵</div></div><div style="text-align:center;margin-bottom:20px"><div style="font-size:16px;font-weight:bold">Летний трек</div><div style="font-size:12px;color:rgba(255,255,255,.7)">Unknown Artist</div></div><div style="background:rgba(255,255,255,.2);height:4px;border-radius:2px;margin-bottom:20px;position:relative"><div style="position:absolute;left:0;top:0;bottom:0;width:40%;background:#fff;border-radius:2px"></div><div style="position:absolute;left:40%;top:-6px;width:16px;height:16px;background:#fff;border-radius:50%"></div></div><div style="display:flex;justify-content:space-around;align-items:center;font-size:28px"><div onclick="notify('⏮ Предыдущий')" style="cursor:pointer">⏮</div><div onclick="notify('▶️ Воспроизведение')" style="cursor:pointer;font-size:44px">▶️</div><div onclick="notify('⏭ Следующий')" style="cursor:pointer">⏭</div></div></div>`}
function renderMessagesApp(){const msgs=[{from:'me',text:'Привет!'},{from:'them',text:'Привет, как дела?'},{from:'me',text:'Отлично, играю в Phone Collector'},{from:'them',text:'Круто! Собери все телефоны 😎'}];return `<div style="background:#1a1a1a;border-radius:16px;padding:16px;min-height:480px;color:#fff;display:flex;flex-direction:column">${phoneBackButton()}<h3 style="margin-bottom:12px">💬 Сообщения</h3><div style="flex:1;overflow-y:auto;max-height:320px">${msgs.map(m=>`<div style="display:flex;justify-content:${m.from==='me'?'flex-end':'flex-start'};margin-bottom:8px"><div style="background:${m.from==='me'?'#4caf50':'#333'};padding:8px 12px;border-radius:12px;max-width:70%;font-size:13px">${m.text}</div></div>`).join('')}</div><div style="display:flex;gap:6px;margin-top:12px"><input id="msg-input" placeholder="Сообщение..." style="flex:1;background:#2a2a2a;border:1px solid #444;color:#fff;padding:8px;border-radius:20px;font-size:13px"><button onclick="notify('✉️ Отправлено!')" style="padding:8px 16px;border-radius:20px">➤</button></div></div>`}
function renderPhoneApp(){const digits=['1','2','3','4','5','6','7','8','9','*','0','#'];return `<div style="background:#1a1a1a;border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<h3 style="margin-bottom:12px">📞 Телефон</h3><div id="dial-display" style="font-size:28px;text-align:center;margin:20px 0;min-height:40px;font-family:monospace">—</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${digits.map(d=>`<div onclick="window.__dialDigit('${d}')" style="background:#2a2a2a;border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;user-select:none">${d}</div>`).join('')}</div><div style="display:flex;justify-content:center;margin-top:20px"><div onclick="window.__dialCall()" style="background:#4caf50;width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer">📞</div></div></div>`}
function renderBrowserApp(){return `<div style="background:#1a1a1a;border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<h3 style="margin-bottom:12px">🌐 Браузер</h3><div style="display:flex;gap:6px;margin-bottom:16px"><input id="browser-url" placeholder="Поиск или URL" style="flex:1;background:#2a2a2a;border:1px solid #444;color:#fff;padding:8px 12px;border-radius:20px;font-size:13px"><button onclick="window.__browseGo()" style="padding:8px 14px;border-radius:20px">→</button></div><div id="browser-content" style="background:#2a2a2a;border-radius:12px;padding:20px;text-align:center;min-height:200px"><div style="font-size:40px;margin-bottom:12px">🌐</div><div style="font-size:13px;color:#888">Введите запрос выше</div></div></div>`}
function renderCalendarApp(){const now=new Date();const year=now.getFullYear(),month=now.getMonth();const daysInMonth=new Date(year,month+1,0).getDate();const firstDay=new Date(year,month,1).getDay();const monthNames=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];const weekNames=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];let cells='';weekNames.forEach(d=>{cells+=`<div style="font-size:10px;color:#888;text-align:center;padding:4px">${d}</div>`});const offset=(firstDay+6)%7;for(let i=0;i<offset;i++)cells+='<div></div>';for(let d=1;d<=daysInMonth;d++){const isToday=d===now.getDate();cells+=`<div onclick="notify('📅 ${d} ${monthNames[month]}')" style="font-size:12px;text-align:center;padding:8px 4px;border-radius:6px;cursor:pointer;${isToday?'background:#4caf50;font-weight:bold':''}">${d}</div>`}return `<div style="background:#1a1a1a;border-radius:16px;padding:16px;min-height:480px;color:#fff">${phoneBackButton()}<h3 style="margin-bottom:12px">📅 ${monthNames[month]} ${year}</h3><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">${cells}</div></div>`}

window.__dialDigit=(d)=>{const el=document.getElementById('dial-display');if(!el)return;if(el.textContent==='—')el.textContent=d;else if(el.textContent.length<15)el.textContent+=d;beep(700,0.05)};
window.__dialCall=()=>{const el=document.getElementById('dial-display');if(!el||el.textContent==='—')return notify('Введите номер',true);notify('📞 Вызов '+el.textContent+'...');el.textContent='—';beep(500,0.2)};
window.__browseGo=()=>{const url=document.getElementById('browser-url')?.value?.trim();const content=document.getElementById('browser-content');if(!url||!content)return;content.innerHTML=`<div style="font-size:40px;margin-bottom:12px">🔍</div><div style="font-size:14px;margin-bottom:8px">Результаты:</div><div style="font-size:12px;color:#4caf50;text-align:left"><div style="margin-bottom:6px">🔗 ${escapeHtml(url)} — Википедия</div><div style="margin-bottom:6px">🔗 ${escapeHtml(url)} — новости</div><div>🔗 ${escapeHtml(url)} — обзор</div></div>`};

// ═══ 16. ДЕЙЛИ / ЗАДАНИЯ / КРАФТ ═══
function claimDaily(){if(!canClaimDaily())return notify('Уже получено',true);const idx=state.dailyStreak%7;const reward=DAILY_REWARDS[idx];state.money+=reward;state.stats.totalEarned+=reward;state.dailyStreak++;state.lastDailyClaim=Date.now();pushHistory(`Ежедневный бонус +${reward} $`);soundWin();save();notify(`🎁 +${reward} $`)}
function claimTask(i){if(!state.dailyTasks)return;const t=state.dailyTasks.tasks[i];if(!t||t.claimed)return;const base=state.dailyTasks.baseline[t.key]||0;const cur=(state.stats[t.key]||0)-base;if(cur<t.target)return notify('Не выполнено',true);t.claimed=true;state.money+=t.reward;state.stats.totalEarned+=t.reward;pushHistory(`Задание: ${t.name} +${t.reward} $`);soundWin();save();notify(`✅ +${t.reward} $`)}
function requestCraft(rarity){const list=state.myPhones.filter(p=>p.rarity===rarity);if(list.length<3)return notify('Нужно 3 телефона',true);const higher=RARITIES[RARITIES.indexOf(rarity)+1];if(!higher)return;showModal(`<h3>⚒️ Крафт</h3><p style="font-size:13px;margin-bottom:10px">Обменять 3 телефона «${RINFO[rarity].label}» на 1 «${RINFO[higher].label}»?</p><div class="actions"><button class="sec" onclick="closeModal()">Отмена</button><button onclick="doCraft('${rarity}')">Скрафтить</button></div>`)}
function doCraft(rarity){const list=state.myPhones.filter(p=>p.rarity===rarity).sort((a,b)=>a.value-b.value).slice(0,3);if(list.length<3){closeModal();return notify('Ошибка',true)}const higher=RARITIES[RARITIES.indexOf(rarity)+1];const pool=ALL_PHONES.filter(p=>p.rarity===higher);const base=pool[Math.floor(Math.random()*pool.length)];const newPhone={...base,id:'own_'+Date.now()+'_'+Math.random().toString(36).substring(2,8),token:genPhoneToken(base.brand),broken:false};const ids=list.map(p=>p.id);state.myPhones=state.myPhones.filter(p=>!ids.includes(p.id));state.myPhones.push(newPhone);state.stats.phonesCrafted++;pushHistory(`Крафт: 3× ${rarity} → ${newPhone.name}`);closeModal();save();notify(`⚒️ Получен ${newPhone.name}`)}

// ═══ 17. ОБМЕН ═══
function viewBotPhones(idx){const bot=state.onlinePlayers[idx];if(!bot)return;let html=`<h3>👤 ${escapeHtml(bot.name)}</h3><p style="font-size:12px;color:var(--tx3);margin-bottom:10px">Токен: ${bot.token}</p><div class="list">`;bot.phones.forEach((p,i)=>{const info=RINFO[p.rarity];html+=`<div class="row-item"><div class="info"><div class="t1" style="color:${info.color}">${escapeHtml(p.name)}</div><div class="t2">${info.label} · ${fmt(p.value)} $</div></div><div class="right"><button class="sm" onclick="chooseMyOffer(${idx},${i})">Обменять</button></div></div>`});html+='</div><div class="actions"><button class="sec" onclick="closeModal()" style="width:100%">Закрыть</button></div>';showModal(html)}
function chooseMyOffer(botIdx,phoneIdx){const bot=state.onlinePlayers[botIdx];const wantPhone=bot.phones[phoneIdx];if(state.myPhones.length===0){closeModal();return notify('У вас нет телефонов',true)}let html=`<h3>Что предложишь?</h3><p style="font-size:12px;color:var(--tx3);margin-bottom:10px">Хочешь: <b>${escapeHtml(wantPhone.name)}</b> (${fmt(wantPhone.value)} $)</p><div class="list">`;state.myPhones.forEach(p=>{const info=RINFO[p.rarity];html+=`<div class="row-item"><div class="info"><div class="t1" style="color:${info.color}">${escapeHtml(p.name)}</div><div class="t2">${info.label} · ${fmt(p.value)} $${p.broken?' · ⚠️ сломан':''}</div></div><div class="right"><button class="sm" onclick="sendExchange(${botIdx},${phoneIdx},'${p.id}')">Предложить</button></div></div>`});html+='</div><div class="actions"><button class="sec" onclick="closeModal()" style="width:100%">Отмена</button></div>';showModal(html)}
function sendExchange(botIdx,phoneIdx,myPhoneId){const bot=state.onlinePlayers[botIdx];const wantPhone=bot.phones[phoneIdx];const offerPhone=state.myPhones.find(p=>p.id===myPhoneId);if(!bot||!wantPhone||!offerPhone)return;if(offerPhone.broken)return notify('Нельзя предложить сломанный телефон',true);const req={id:'req_'+Date.now(),toName:bot.name,toToken:bot.token,wantsName:wantPhone.name,offersName:offerPhone.name,wantsValue:wantPhone.value,offersValue:offerPhone.value,wantPhoneId:wantPhone.id,offerPhoneId:offerPhone.id,botIdx,ts:Date.now()};state.sentRequests.push(req);closeModal();save();notify(`📤 Запрос отправлен ${bot.name}`);setTimeout(()=>{state.sentRequests=state.sentRequests.filter(r=>r.id!==req.id);const accept=offerPhone.value>=wantPhone.value*0.7||Math.random()<0.3;if(accept){const myIdx=state.myPhones.findIndex(p=>p.id===offerPhone.id);if(myIdx===-1){save();return}state.myPhones.splice(myIdx,1);state.myPhones.push({...wantPhone,id:'own_'+Date.now()+'_'+Math.random().toString(36).substring(2,8)});state.stats.exchanges++;const bi=state.onlinePlayers.findIndex(b=>b.token===bot.token);if(bi!==-1){const pi=state.onlinePlayers[bi].phones.findIndex(p=>p.id===wantPhone.id);if(pi!==-1)state.onlinePlayers[bi].phones[pi]={...offerPhone,id:'bot_'+Date.now()+'_'+Math.random().toString(36).substring(2,8)}}pushHistory(`Обмен с ${bot.name}: ${offerPhone.name} → ${wantPhone.name}`);save();notify(`✅ ${bot.name} принял обмен! Получен ${wantPhone.name}`);soundWin()}else{save();notify(`❌ ${bot.name} отклонил обмен`)}},8000+Math.random()*12000)}
function maybeGenerateIncoming(){if(state.incomingRequests.length>=3)return;if(state.myPhones.length===0)return;if(Math.random()>0.008)return;ensureOnlinePlayers();const bot=state.onlinePlayers[Math.floor(Math.random()*state.onlinePlayers.length)];if(!bot.phones.length)return;const wantMy=state.myPhones[Math.floor(Math.random()*state.myPhones.length)];const offerBot=bot.phones[Math.floor(Math.random()*bot.phones.length)];state.incomingRequests.push({id:'inc_'+Date.now(),fromName:bot.name,fromToken:bot.token,wantsName:wantMy.name,offersName:offerBot.name,wantsId:wantMy.id,offersId:offerBot.id,offersPhone:{...offerBot},ts:Date.now()});save();notify(`📥 Новый запрос на обмен от ${bot.name}`)}
function acceptIncoming(idx){const req=state.incomingRequests[idx];if(!req)return;const myIdx=state.myPhones.findIndex(p=>p.id===req.wantsId);if(myIdx===-1){state.incomingRequests.splice(idx,1);save();return notify('Телефон уже продан',true)}state.myPhones.splice(myIdx,1);state.myPhones.push({...req.offersPhone,id:'own_'+Date.now()+'_'+Math.random().toString(36).substring(2,8)});state.stats.exchanges++;state.incomingRequests.splice(idx,1);pushHistory(`Принят обмен от ${req.fromName}: получил ${req.offersName}`);save();notify(`✅ Обмен принят! Получен ${req.offersName}`);soundWin()}
function declineIncoming(idx){state.incomingRequests.splice(idx,1);save();notify('Отклонено')}

// ═══ 18. НАСТРОЙКИ / СБРОС ═══
function copyToken(){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(state.myToken).then(()=>notify('📋 Токен скопирован'))}else{prompt('Ваш токен:',state.myToken)}}
function saveNickname(){const v=document.getElementById('nick-input').value.trim();if(!v)return notify('Введите ник',true);state.nickname=v;save();notify('✅ Ник сохранён')}
function toggleTheme(){state.settings.theme=state.settings.theme==='dark'?'light':'dark';save()}
function toggleMute(){state.settings.muted=!state.settings.muted;save()}
function requestReset(){showModal(`<h3>🗑 Сброс прогресса</h3><p style="font-size:13px;margin-bottom:10px">Все телефоны, деньги и достижения будут удалены. Вы уверены?</p><div class="actions"><button class="sec" onclick="closeModal()">Отмена</button><button class="dg" onclick="doReset()">Сбросить</button></div>`)}
function doReset(){localStorage.removeItem(STORAGE_KEY);location.reload()}

// ═══ 19. ИНТЕГРАЦИЯ SDK (Яндекс + RuStore) ═══
async function initYandexSDK(){
  if(typeof YaGames==='undefined')return;
  try{
    const ysdk=await YaGames.init();
    window.ysdk=ysdk;
    yandexPlayer=await ysdk.getPlayer({scopes:false});
    console.log('✅ Yandex SDK ready, player:',yandexPlayer.getName());
    const data=await yandexPlayer.getData(['save']);
    if(data&&data.save&&data.save.lastSaveTs){
      if(data.save.lastSaveTs>(state.lastSaveTs||0)){
        state=Object.assign({},DEFAULT_STATE,data.save);
        localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
        render();
        notify('☁️ Загружено облачное сохранение');
      }
    }
    setInterval(async()=>{
      if(!yandexPlayer)return;
      try{await yandexPlayer.setData({save:state},false)}catch(e){}
    },30000);
  }catch(e){console.log('Yandex SDK error:',e)}
}
function initRuStoreSDK(){
  if(typeof window.RuStoreSDK==='undefined')return;
  console.log('✅ RuStore SDK detected');
  // Здесь можно подписаться на RuStore события:
  // RuStoreSDK.on('pause', ...) и т.д.
}

// ═══ 20. ЗАПУСК ═══
function init(){
  generateAllPhones();ensureOnlinePlayers();refreshShopIfNeeded();ensureDailyTasks();
  if(state.repairOrders.length===0)generateRepairOrders();
  render();
  setInterval(()=>{
    if(Date.now()>=state.shopExpiresAt){refreshShop();save()}
    if(currentScreen==='shop'){const el=document.querySelector('h2 span');if(el){const t=Math.max(0,state.shopExpiresAt-Date.now());const hh=Math.floor(t/3600000),mm=Math.floor((t%3600000)/60000),ss=Math.floor((t%60000)/1000);el.textContent=`⏱ ${hh}:${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}}
    if(currentScreen==='repair'&&state.repairOrders.length===0){generateRepairOrders();if(document.getElementById('repair-content'))document.getElementById('repair-content').innerHTML=renderRepairContent('orders')}
  },1000);
  setInterval(maybeGenerateIncoming,30000);
  initYandexSDK();
  initRuStoreSDK();
}
init();
</script>
